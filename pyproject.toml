[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetype"
version = "0.1.0"
description = "Voice-to-text overlay daemon for Linux (Persian-first, Wayland/X11)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sounddevice>=0.4.6",
    "SpeechRecognition>=3.10",
]

[project.optional-dependencies]
vosk = ["vosk>=0.3.45"]
whisper = ["faster-whisper>=1.0"]
hotkey = ["evdev>=1.6"]
socks = ["PySocks>=1.7"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
voicetype = "voicetype.cli:main"
voicetype-toggle = "voicetype.cli:toggle_main"

[tool.setuptools.packages.find]
include = ["voicetype*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
